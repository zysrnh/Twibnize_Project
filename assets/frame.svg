<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Mask untuk melubangi bagian tengah frame tempat foto maba -->
    <mask id="photo-cutout-mask">
      <!-- Putih = Terlihat (Solid) -->
      <rect x="0" y="0" width="1080" height="1080" fill="#ffffff" />
      <!-- Hitam = Bolong / Transparan (Tempat Foto) -->
      <rect x="140" y="160" width="800" height="660" rx="32" ry="32" fill="#000000" />
    </mask>
  </defs>

  <!-- BACKGROUND FRAME DENGAN LUBANG FOTO -->
  <g mask="url(#photo-cutout-mask)">
    <!-- Base Solid Background -->
    <rect x="0" y="0" width="1080" height="1080" fill="#0f172a" />
    
    <!-- Flat Accent Shapes -->
    <rect x="0" y="0" width="1080" height="30" fill="#2563eb" />
    <rect x="0" y="1050" width="1080" height="30" fill="#f59e0b" />
    
    <!-- Decorative Flat Corner Accents -->
    <polygon points="0,30 180,30 0,210" fill="#1e3a8a" />
    <polygon points="1080,30 900,30 1080,210" fill="#1d4ed8" />
    <polygon points="0,1050 200,1050 0,850" fill="#d97706" />
    <polygon points="1080,1050 880,1050 1080,850" fill="#1e293b" />
  </g>

  <!-- BORDER FRAME FOTO -->
  <rect x="140" y="160" width="800" height="660" rx="32" ry="32" fill="none" stroke="#2563eb" stroke-width="12" />
  <rect x="128" y="148" width="824" height="684" rx="40" ry="40" fill="none" stroke="#f59e0b" stroke-width="4" />

  <!-- HEADER BRANDING / BADGE -->
  <rect x="340" y="70" width="400" height="64" rx="8" fill="#2563eb" />
  <text x="540" y="112" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    OFFICIAL TWIBBON
  </text>

  <!-- FOOTER CARD / IDENTITAS ACARA -->
  <g transform="translate(0, 0)">
    <!-- Container Card Bawah -->
    <rect x="120" y="860" width="840" height="160" rx="12" fill="#1e293b" stroke="#334155" stroke-width="3" />
    <rect x="120" y="860" width="840" height="12" rx="0" fill="#f59e0b" />
    
    <!-- Title -->
    <text x="540" y="915" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      MAHASISWA BARU 2026
    </text>
    
    <!-- Subtitle / Slogan -->
    <text x="540" y="955" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="2">
      SIAP BERKARYA &amp; BERPRESTASI UNTUK NEGERI
    </text>

    <!-- Tagline Badge -->
    <rect x="420" y="975" width="240" height="32" rx="4" fill="#2563eb" />
    <text x="540" y="997" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
      #BANGGA_GABUNG
    </text>
  </g>

  <!-- DECORATIVE CORNER MARKS -->
  <circle cx="170" cy="190" r="10" fill="#f59e0b" />
  <circle cx="910" cy="190" r="10" fill="#2563eb" />
</svg>
